<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>올림픽공원 주차 예보 (준비 중)</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;color:#1a2b4a}
.n{font-size:56px;font-weight:700}small{color:#667}svg{width:100%;height:160px;background:#f4f7fb;border-radius:8px}</style></head>
<body><h1>올림픽공원 주차 예보</h1><p><small>서비스 준비 중 · 실시간 수집 확인용 임시 화면</small></p>
<div class="n" id="n">-</div><small id="t"></small><svg id="c" viewBox="0 0 600 160" preserveAspectRatio="none"></svg>
<p><small>출처: 한국체육산업개발(주) 실시간 주차현황 오픈API (공공데이터포털)</small></p>
<script>
fetch('data/parking_log.csv?'+Date.now()).then(r=>r.text()).then(t=>{
 const rows=t.trim().split('\n').slice(1).map(l=>l.split(',')).filter(r=>r.length==2);
 if(!rows.length)return; const last=rows[rows.length-1];
 document.getElementById('n').textContent=Number(last[1]).toLocaleString()+'대';
 document.getElementById('t').textContent='현재 주차 대수 · '+last[0]+' 기준';
 const v=rows.slice(-432).map(r=>+r[1]),mx=Math.max(...v),mn=Math.min(...v),s=mx-mn||1;
 const p=v.map((y,i)=>(i/(v.length-1||1)*600).toFixed(1)+','+(150-(y-mn)/s*140).toFixed(1)).join(' ');
 document.getElementById('c').innerHTML='<polyline fill="none" stroke="#12408c" stroke-width="2" points="'+p+'"/>';
});
</script></body></html>
