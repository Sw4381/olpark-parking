name: collect-parking
on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/collect.py
      - name: nearby lots
        continue-on-error: true
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python scripts/fetch_nearby.py
      - name: forecast
        continue-on-error: true
        run: python scripts/build_forecast.py
      - name: commit
        run: |
          git config user.name "olpark-bot"
          git config user.email "olpark-bot@users.noreply.github.com"
          git add data/parking_log.csv
          git add data/nearby.json data/forecast.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "data: parking snapshot"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((RANDOM % 15 + 5))
          done
          exit 1
